name: Ready Rocker CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # -------------------------
  # INSTALL
  # -------------------------
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci


  # -------------------------
  # SECURITY CHECK
  # -------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run strict dependency audit
        run: npx audit-ci --high


  # -------------------------
  # LINT + BUILD
  # -------------------------
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Build App
        run: npm run build


  # -------------------------
  # DEPLOY (CD)
  # -------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # -------------------------
      # VERCEL DEPLOY (example)
      # -------------------------
      - name: Deploy to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}


  # -------------------------
  # DISCORD + WHATSAPP NOTIFICATIONS
  # -------------------------
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # DISCORD SUCCESS
      # -------------------------
      - name: Discord Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "content": "🚀 **Ready Rocker Deployment Successful**",
            "embeds": [
              {
                "title": "Production Live",
                "color": 3066993,
                "fields": [
                  { "name": "Status", "value": "✅ Success", "inline": true },
                  { "name": "Branch", "value": "main", "inline": true },
                  { "name": "Commit", "value": "${{ github.sha }}", "inline": false },
                  { "name": "Triggered By", "value": "${{ github.actor }}", "inline": true }
                ]
              }
            ]
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}

      # -------------------------
      # DISCORD FAILURE
      # -------------------------
      - name: Discord Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{
            "content": "❌ **Ready Rocker Deployment Failed**",
            "embeds": [
              {
                "title": "Pipeline Failure",
                "color": 15158332,
                "fields": [
                  { "name": "Status", "value": "❌ Failed", "inline": true },
                  { "name": "Fix Needed", "value": "Check build, lint, or security logs in GitHub Actions" }
                ]
              }
            ]
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
